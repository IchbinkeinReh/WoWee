name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A newer push to the same branch, or to the same pull request, supersedes
# this run. Without it every commit queued its own full run, and a busy day
# left the release build waiting hours behind builds nobody would look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86-64
          runner: ubuntu-24.04
          deb_arch: amd64
          build_jobs: $(nproc)
        - arch: arm64
          runner: ubuntu-24.04-arm
          deb_arch: arm64
          build_jobs: 2

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ matrix.arch }}-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: apt-${{ matrix.arch }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          pkg-config \
          libglm-dev \
          libssl-dev \
          zlib1g-dev \
          libvulkan-dev \
          vulkan-tools \
          glslc \
          libavformat-dev \
          libavcodec-dev \
          libswscale-dev \
          libavutil-dev \
          libunicorn-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libxfixes-dev \
          libxss-dev \
          libxkbcommon-dev \
          libwayland-dev \
          wayland-protocols \
          libdecor-0-dev \
          libx11-dev
        sudo apt-get install -y libstorm-dev || true

    - name: Build SDL3 from source
      run: |
        # Ubuntu 24.04 has no libsdl3-dev: SDL3 landed in 25.04. Built here
        # the way StormLib already is, rather than pinning the job to a newer
        # runner image for one package.
        set -euo pipefail
        git clone --depth 1 --branch release-3.2.24 \
          https://github.com/libsdl-org/SDL.git /tmp/SDL3
        cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build /tmp/SDL3/build --parallel "$(nproc)"
        sudo cmake --install /tmp/SDL3/build
        sudo ldconfig

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_TESTS=ON

    - name: Assert AMD FSR2 target
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel ${{ matrix.build_jobs }}
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      run: |
        set -euo pipefail
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel ${{ matrix.build_jobs }}
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      run: cmake --build build --parallel ${{ matrix.build_jobs }}

    # The editor is off the default build - it is large and ordinary client
    # work does not need it - so nothing was compiling it, here or locally, and
    # it rotted: twenty files lost an include and a helper lost a method that
    # twelve callers still used, and it sat broken with no signal at all.
    # Built on this job only; one platform is enough to catch a missing include
    # or a changed signature, and the other jobs stay as quick as they were.
    - name: Build editor
      run: cmake --build build --target wowee_editor --parallel ${{ matrix.build_jobs }}

    - name: Run tests
      run: cd build && ctest --output-on-failure

    # cpack builds `all` again before packaging (its preinstall target), and
    # serially unless told otherwise. A clean tree makes that a no-op; the
    # parallel level keeps it short if something ever leaves the tree dirty.
    - name: Package (DEB)
      run: cd build && CMAKE_BUILD_PARALLEL_LEVEL=${{ matrix.build_jobs }} cpack -G DEB

    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: wowee-linux-${{ matrix.arch }}-deb
        path: build/wowee-*.deb
        if-no-files-found: error

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # GitHub often finds no Apple Silicon runner for this repository and drops
    # the arm64 job unrun, so it must not turn master red. The Intel runner has
    # been reliable and still gates the run. Publish release below checks its
    # result on its own.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          # macos-latest rather than macos-15: the explicit label sat in GitHub's
          # arm64 capacity queue until the job was dropped unrun ("not acquired
          # by Runner of type hosted"), while build-ios on macos-latest ran.
          runner: macos-latest
          verify_arch: arm64
        - arch: x86-64
          # macos-13 was the old Intel image and has been retired; a job asking
          # for it queues for ever rather than failing. macos-15-intel is the
          # current x64 label.
          runner: macos-15-intel
          # What lipo calls it, which is not what the job is named.
          verify_arch: x86_64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install dependencies
      run: |
        brew install cmake pkg-config sdl3 glm openssl@3 zlib ffmpeg unicorn \
          stormlib vulkan-loader vulkan-headers molten-vk shaderc

    - name: Configure
      run: |
        BREW=$(brew --prefix)
        PKG_CONFIG_PATH="$BREW/lib/pkgconfig:$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig:$(brew --prefix shaderc)/lib/pkgconfig"
        export PKG_CONFIG_PATH
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_PREFIX_PATH="$BREW" \
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
          \
          -DWOWEE_BUILD_TESTS=ON

    - name: Assert AMD FSR2 target
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel "$(sysctl -n hw.logicalcpu)"
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      run: |
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel "$(sysctl -n hw.logicalcpu)"
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

    - name: Run tests
      run: cd build && ctest --output-on-failure

    - name: Configure Developer ID signing
      env:
        APPLE_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
        APPLE_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
      run: |
        if [ -z "${APPLE_CERT_P12}" ] || [ -z "${APPLE_CERT_PASSWORD}" ] || \
           [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
          # No Developer ID in this repository: sign ad hoc. The app then
          # needs right-click > Open (or xattr -cr) on first launch.
          echo "MACOS_SIGNING_ENABLED=false" >> "${GITHUB_ENV}"
          echo "::warning::Apple Developer ID secrets are not set; using ad-hoc signing."
          exit 0
        fi

        KEYCHAIN_PATH="${RUNNER_TEMP}/wowee-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        printf '%s' "${APPLE_CERT_P12}" | base64 -D \
          > "${RUNNER_TEMP}/developer-id.p12"
        security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
        security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security import "${RUNNER_TEMP}/developer-id.p12" \
          -k "${KEYCHAIN_PATH}" -P "${APPLE_CERT_PASSWORD}" -A -t cert -f pkcs12
        security set-key-partition-list -S apple-tool:,apple: -s \
          -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security list-keychain -d user -s "${KEYCHAIN_PATH}"
        echo "MACOS_SIGNING_ENABLED=true" >> "${GITHUB_ENV}"
        echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

    - name: Create .app bundle
      run: |
        mkdir -p Wowee.app/Contents/{MacOS,Frameworks,Resources}
        bash tools/macos/create_icns.sh assets/Wowee.png \
          Wowee.app/Contents/Resources/Wowee.icns

        # Actual binary
        cp build/bin/wowee Wowee.app/Contents/MacOS/wowee_bin

        # Asset extraction is a required part of the macOS distribution.
        test -x build/bin/asset_extract
        cp build/bin/asset_extract Wowee.app/Contents/MacOS/

        # The asset manager: the window that builds the assets, which replaced
        # a Python one needing an interpreter with Tkinter built into it.
        test -x build/bin/wowee_assets
        cp build/bin/wowee_assets Wowee.app/Contents/MacOS/

        # The command-line extractor's script remains for advanced users.
        cp extract_assets.sh Wowee.app/Contents/Resources/

        # Assets (exclude proprietary music)
        rsync -a --exclude='Original Music' build/bin/assets/ \
          Wowee.app/Contents/Resources/assets/

        # Data directory (git-tracked redistributable files only)
        git ls-files Data/ | while read -r f; do
          mkdir -p "Wowee.app/Contents/Resources/$(dirname "$f")"
          cp "$f" "Wowee.app/Contents/Resources/$f"
        done

        # The Vulkan loader is not a graphics driver. Bundle MoltenVK and its
        # ICD manifest so the app works on a clean Mac without Homebrew or the
        # LunarG SDK installed.
        MOLTENVK_PREFIX="$(brew --prefix molten-vk)"
        cp -L "${MOLTENVK_PREFIX}/lib/libMoltenVK.dylib" \
          Wowee.app/Contents/Frameworks/libMoltenVK.dylib

        # Copied explicitly although the client now links SDL3 directly and
        # the Mach-O walker below would find it: the walker rewrites what it
        # finds, and having the dylib already in place keeps that one step.
        SDL3_PREFIX="$(brew --prefix sdl3)"
        cp -L "${SDL3_PREFIX}/lib/libSDL3.dylib" \
          Wowee.app/Contents/Frameworks/libSDL3.dylib
        mkdir -p Wowee.app/Contents/Resources/vulkan/icd.d
        python3 - \
          "${MOLTENVK_PREFIX}/etc/vulkan/icd.d/MoltenVK_icd.json" \
          Wowee.app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json <<'PY'
        import json
        import pathlib
        import sys

        source, destination = map(pathlib.Path, sys.argv[1:])
        manifest = json.loads(source.read_text(encoding="utf-8"))
        manifest["ICD"]["library_path"] = "../../../Frameworks/libMoltenVK.dylib"
        manifest["ICD"]["is_portability_driver"] = True
        destination.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
        PY

        # Traverse every non-system dependency from the original Mach-O files,
        # copy only the referenced install names, and rewrite the whole graph.
        python3 tools/macos/bundle_dependencies.py \
          --app Wowee.app \
          --search-dir "$(brew --prefix sdl3)/lib" \
          --search-dir "$(brew --prefix vulkan-loader)/lib" \
          --search-dir "$(brew --prefix openssl@3)/lib" \
          --search-dir "$(brew --prefix ffmpeg)/lib" \
          --search-dir "$(brew --prefix unicorn)/lib" \
          --search-dir "$(brew --prefix stormlib)/lib" \
          --search-dir "$(brew --prefix glm)/lib" \
          Wowee.app/Contents/MacOS/wowee_bin \
          Wowee.app/Contents/MacOS/asset_extract \
          Wowee.app/Contents/MacOS/wowee_assets \
          Wowee.app/Contents/Frameworks/libMoltenVK.dylib \
          Wowee.app/Contents/Frameworks/libSDL3.dylib

        # Info.plist
        cat > Wowee.app/Contents/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>wowee_bin</string>
          <key>CFBundleIdentifier</key><string>com.wowee.app</string>
          <key>CFBundleName</key><string>Wowee</string>
          <key>CFBundleIconFile</key><string>Wowee</string>
          <key>CFBundleVersion</key><string>1.0.0</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
        </dict></plist>
        EOF

        # Build a visible, independently signed extraction launcher.
        bash tools/macos/create_asset_extractor_app.sh \
          "Wowee Asset Extractor.app" "1.0.0" \
          Wowee.app/Contents/Resources/Wowee.icns

        IDENTITY="-"
        if [ "${MACOS_SIGNING_ENABLED}" = "true" ]; then
          IDENTITY="${APPLE_SIGNING_IDENTITY}"
        fi
        bash tools/macos/sign_app.sh Wowee.app "${IDENTITY}" \
          tools/macos/wowee.entitlements
        bash tools/macos/sign_app.sh "Wowee Asset Extractor.app" "${IDENTITY}"
        bash tools/macos/verify_signature.sh Wowee.app "${IDENTITY}" \
          com.apple.security.cs.allow-jit
        bash tools/macos/verify_signature.sh \
          "Wowee Asset Extractor.app" "${IDENTITY}"

    - name: Verify bundled dylibs
      run: |
        bash tools/macos/verify_bundle.sh Wowee.app ${{ matrix.verify_arch }}
        codesign --verify --deep --strict --verbose=2 "Wowee Asset Extractor.app"

    - name: Create DMG
      run: |
        set -euo pipefail
        rm -f Wowee.dmg
        rm -rf dmg-root
        mkdir dmg-root
        mv Wowee.app dmg-root/
        mv "Wowee Asset Extractor.app" dmg-root/
        cp tools/macos/ASSET_EXTRACTION_README.txt \
          "dmg-root/README - Asset Extraction.txt"
        ln -s /Applications dmg-root/Applications
        # CI runners can occasionally leave a mounted volume around; detach if present.
        if [ -d "/Volumes/Wowee" ]; then
          hdiutil detach "/Volumes/Wowee" -force || true
          sleep 2
        fi

        ok=0
        for attempt in 1 2 3 4 5; do
          if hdiutil create -volname Wowee -srcfolder dmg-root -ov -format UDZO Wowee.dmg; then
            ok=1
            break
          fi
          echo "hdiutil create failed on attempt ${attempt}; retrying..."
          if [ -d "/Volumes/Wowee" ]; then
            hdiutil detach "/Volumes/Wowee" -force || true
          fi
          sleep 3
        done

        if [ "$ok" -ne 1 ] || [ ! -f Wowee.dmg ]; then
          echo "Failed to create Wowee.dmg after retries."
          exit 1
        fi

        if [ "${MACOS_SIGNING_ENABLED}" = "true" ]; then
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" \
            --timestamp Wowee.dmg
          codesign --verify --strict --verbose=2 Wowee.dmg
        fi

    - name: Notarize and staple DMG
      env:
        APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      run: |
        if [ "${MACOS_SIGNING_ENABLED}" != "true" ] || \
           [ -z "${APPLE_NOTARY_KEY}" ] || [ -z "${APPLE_NOTARY_KEY_ID}" ] || \
           [ -z "${APPLE_NOTARY_ISSUER_ID}" ]; then
          echo "::warning::Not notarized: no Developer ID signing or notary credentials."
          exit 0
        fi

        printf '%s' "${APPLE_NOTARY_KEY}" | base64 -D \
          > "${RUNNER_TEMP}/AuthKey.p8"
        # Apple's own failures are reported through this job, and the summary
        # only says "Build (macOS arm64) failure" - which reads as broken code.
        # An expired Developer Program agreement sent someone bisecting commits
        # against a tree that had already compiled and passed its tests on the
        # very same source. Say which of the two it is.
        set +e
        notary_log="${RUNNER_TEMP}/notarytool.log"
        # Resubmit only when the connection to Apple dropped; a rejection or
        # account problem fails the same way every time.
        for attempt in 1 2 3 4 5; do
          xcrun notarytool submit Wowee.dmg \
            --key "${RUNNER_TEMP}/AuthKey.p8" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait --timeout 30m 2>&1 | tee "${notary_log}"
          notary_status=${PIPESTATUS[0]}
          if [ "${notary_status}" -eq 0 ] || [ "${attempt}" -eq 5 ] || \
             ! grep -q "NSURLErrorDomain" "${notary_log}"; then
            break
          fi
          sleep $((attempt * 15))
        done
        set -e
        if [ "${notary_status}" -ne 0 ]; then
          if grep -q "required agreement is missing or has expired" "${notary_log}"; then
            echo "::error::Notarization was refused by Apple: the Developer" \
                 "Program agreement needs signing or renewing in App Store" \
                 "Connect. The build and tests passed - this is an account" \
                 "problem, not a code one."
          else
            echo "::error::Notarization failed. See the notarytool output above."
          fi
          exit "${notary_status}"
        fi
        # stapler talks to Apple's ticket service; retry transient network drops.
        for action in staple validate; do
          for attempt in 1 2 3 4 5; do
            if xcrun stapler "${action}" Wowee.dmg; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
        done
        spctl --assess --type open --context context:primary-signature \
          --verbose=2 Wowee.dmg

    - name: Upload DMG
      uses: actions/upload-artifact@v7
      with:
        name: wowee-macos-${{ matrix.arch }}-dmg
        path: Wowee.dmg
        if-no-files-found: error

  build-windows-arm:
    name: Build (windows-arm64)
    runs-on: windows-11-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        # Disable the install cache: a restored cache carries a stale pacman DB
        # whose signatures the older cached keyring rejects ("unknown trust"),
        # breaking the setup -Syuu after MSYS2 rotates signing keys.
        cache: false

    # Install packages in a separate retried step rather than the action's `install:`
    # list - the ARM MSYS2 mirrors intermittently drop the initial download/keyring
    # sync, which fails the whole setup with no retry. Mirrors the release workflow.
    - name: Install dependencies with mirror retry
      shell: msys2 {0}
      run: |
        packages=(
          mingw-w64-clang-aarch64-cmake
          mingw-w64-clang-aarch64-clang
          mingw-w64-clang-aarch64-ninja
          mingw-w64-clang-aarch64-pkgconf
          mingw-w64-clang-aarch64-sdl3
          mingw-w64-clang-aarch64-glm
          mingw-w64-clang-aarch64-openssl
          mingw-w64-clang-aarch64-zlib
          mingw-w64-clang-aarch64-ffmpeg
          mingw-w64-clang-aarch64-unicorn
          mingw-w64-clang-aarch64-vulkan-loader
          mingw-w64-clang-aarch64-vulkan-headers
          mingw-w64-clang-aarch64-shaderc
          mingw-w64-clang-aarch64-libtommath
          mingw-w64-clang-aarch64-libtomcrypt
          git
        )
        for attempt in 1 2 3; do
          if pacman -S --noconfirm --needed "${packages[@]}"; then
            exit 0
          fi
          echo "MSYS2 package download failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        exit 1

    - name: Build StormLib from source
      shell: msys2 {0}
      run: |
        git clone --depth 1 https://github.com/ladislav-zezula/StormLib.git /tmp/StormLib
        # Disable x86 inline asm in bundled libtomcrypt (bswapl/movl) -
        # __MINGW32__ is defined on CLANGARM64 which incorrectly enables x86 asm
        cmake -S /tmp/StormLib -B /tmp/StormLib/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_C_FLAGS="-DLTC_NO_BSWAP" \
          -DCMAKE_CXX_FLAGS="-DLTC_NO_BSWAP"
        cmake --build /tmp/StormLib/build --parallel $(nproc)
        cmake --install /tmp/StormLib/build

    - name: Configure
      shell: msys2 {0}
      # The editor ships in the Windows package as well: in the default build,
      # so the package's install rule picks it up.
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_EDITOR=ON

    - name: Assert AMD FSR2 target
      shell: msys2 {0}
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel $(nproc)
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      shell: msys2 {0}
      run: |
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel $(nproc)
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --parallel $(nproc)

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        # Every program that ships, not the client alone. The asset tools are
        # how anybody gets data to run the client with, and a configure that
        # quietly disabled them - StormLib or SDL2 not found - produced a
        # package with neither and said nothing. Their DLLs were assumed to be
        # a subset of the client's rather than collected.
        test -x build/bin/wowee.exe
        test -x build/bin/asset_extract.exe
        test -x build/bin/wowee_assets.exe
        test -x build/bin/wowee_editor.exe
        for exe in build/bin/wowee.exe build/bin/asset_extract.exe build/bin/wowee_assets.exe \
                   build/bin/wowee_editor.exe; do
          ldd "$exe" \
            | awk '/=> \// { print $3 }' \
            | grep -iv '^/c/Windows' \
            | xargs -I{} sh -c 'cp -n "{}" build/bin/ 2>/dev/null || true'
        done

    - name: Package (ZIP)
      shell: msys2 {0}
      run: cd build && CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cpack -G ZIP

    - name: Upload ZIP
      uses: actions/upload-artifact@v7
      with:
        name: wowee-windows-arm64-zip
        path: build/wowee-*.zip
        if-no-files-found: error

  build-windows:
    name: Build (windows-x86-64)
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        # See note above: avoid the stale cached keyring/DB "unknown trust" failure.
        cache: false

    # Installed in a retried step rather than through the action's `install:`
    # list, for the same reason the arm64 job does it: a mirror that stalls
    # mid-download fails the whole transaction, and the action has no retry -
    # so one slow mirror reads as a broken build. Seen on p11-kit, pixman and
    # openblas from mirror.msys2.org and ftp2.osuosl.org, at "less than 1
    # bytes/sec", before a single file of this project was compiled.
    - name: Install dependencies with mirror retry
      shell: msys2 {0}
      run: |
        packages=(
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-sdl3
          mingw-w64-ucrt-x86_64-glm
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-ffmpeg
          mingw-w64-ucrt-x86_64-unicorn
          mingw-w64-ucrt-x86_64-vulkan-loader
          mingw-w64-ucrt-x86_64-vulkan-headers
          mingw-w64-ucrt-x86_64-shaderc
          mingw-w64-ucrt-x86_64-nsis
          mingw-w64-ucrt-x86_64-libtommath
          mingw-w64-ucrt-x86_64-libtomcrypt
          git
        )
        for attempt in 1 2 3; do
          if pacman -S --noconfirm --needed "${packages[@]}"; then
            exit 0
          fi
          echo "MSYS2 package download failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        exit 1

    - name: Build StormLib from source
      shell: msys2 {0}
      run: |
        git clone --depth 1 https://github.com/ladislav-zezula/StormLib.git /tmp/StormLib
        cmake -S /tmp/StormLib -B /tmp/StormLib/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
          -DBUILD_SHARED_LIBS=OFF
        cmake --build /tmp/StormLib/build --parallel $(nproc)
        cmake --install /tmp/StormLib/build

    - name: Configure
      shell: msys2 {0}
      # The editor ships in the Windows package as well: in the default build,
      # so the package's install rule picks it up.
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_EDITOR=ON

    - name: Assert AMD FSR2 target
      shell: msys2 {0}
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel $(nproc)
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      shell: msys2 {0}
      run: |
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel $(nproc)
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --parallel $(nproc)

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        # Every program that ships, not the client alone. The asset tools are
        # how anybody gets data to run the client with, and a configure that
        # quietly disabled them - StormLib or SDL2 not found - produced a
        # package with neither and said nothing. Their DLLs were assumed to be
        # a subset of the client's rather than collected.
        test -x build/bin/wowee.exe
        test -x build/bin/asset_extract.exe
        test -x build/bin/wowee_assets.exe
        test -x build/bin/wowee_editor.exe
        # The headset client (cmake/WoweeVr.cmake), built by default here and
        # installed beside wowee.exe; required, so a configure that lost it
        # fails here rather than shipping without it.
        test -x build/bin/wowee_vr.exe
        for exe in build/bin/wowee.exe build/bin/asset_extract.exe build/bin/wowee_assets.exe \
                   build/bin/wowee_editor.exe build/bin/wowee_vr.exe; do
          ldd "$exe" \
            | awk '/=> \// { print $3 }' \
            | grep -iv '^/c/Windows' \
            | xargs -I{} sh -c 'cp -n "{}" build/bin/ 2>/dev/null || true'
        done

    - name: Package (NSIS)
      shell: msys2 {0}
      run: cd build && CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cpack -G NSIS

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: wowee-windows-x86-64-installer
        path: build/wowee-*.exe
        if-no-files-found: error

  build-android:
    name: Build (android arm64)
    runs-on: ubuntu-24.04

    # The Android sources are behind __ANDROID__ and nothing else compiles
    # them, so until now only a release tag found out whether they still
    # built. The SDL3 migration left two renamed event constants behind in
    # application.cpp and the first sign of it was a broken release. Compiled
    # here for the same reason the editor is: one job that says so beforehand.
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        # The APK takes its version from the nearest tag, which a shallow
        # clone does not fetch. Without them the build falls back to 0.0.0.
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Install the NDK the project pins
      run: |
        # android/app/build.gradle names this version; the runner ships another.
        yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
          --install "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0" >/dev/null

    - name: Cache OpenSSL for Android
      id: cache-openssl
      uses: actions/cache@v6
      with:
        path: build-android-deps
        key: android-openssl-${{ hashFiles('tools/build-android-deps.sh') }}

    - name: Build OpenSSL for arm64
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        tools/build-android-deps.sh arm64-v8a

    - name: Build the APK
      working-directory: android
      env:
        # A repository with these secrets signs every build with one key, so
        # each APK installs over the last; without them it is the debug key.
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        WOWEE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        WOWEE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          export WOWEE_KEYSTORE_FILE="${RUNNER_TEMP}/wowee.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${WOWEE_KEYSTORE_FILE}"
        fi
        ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: wowee-android-arm64-apk
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error

  build-ios:
    name: Build (iOS arm64, unsigned)
    runs-on: macos-latest
    # Same Apple Silicon runner shortage as macOS arm64 above.
    continue-on-error: true

    # The same client as the Android one, built for iPhone and iPad through
    # MoltenVK. Unsigned: CODE_SIGNING_ALLOWED=NO, so the .ipa installs only
    # once something re-signs it (a developer account, AltStore, Sideloadly).
    # Not in the release's needs until it has run green for a while.
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: Install host tools
      # glslc for the shaders; the rest of the dependencies are built for iOS
      # below, not taken from Homebrew.
      run: brew install shaderc

    - name: Cache OpenSSL and MoltenVK for iOS
      id: cache-ios-deps
      uses: actions/cache@v4
      with:
        path: build-ios-deps
        key: ios-deps-${{ hashFiles('tools/build-ios-deps.sh') }}

    - name: Build OpenSSL, fetch MoltenVK
      run: tools/build-ios-deps.sh

    - name: Configure
      run: |
        set -a; . build-ios-deps/paths.env; set +a
        cmake -S . -B build-ios -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DWOWEE_BUILD_TESTS=OFF \
          -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
          -DOPENSSL_USE_STATIC_LIBS=ON \
          -DWOWEE_MOLTENVK_LIB="$WOWEE_MOLTENVK_LIB" \
          -DWOWEE_VULKAN_INCLUDE_DIR="$WOWEE_VULKAN_INCLUDE_DIR"

    - name: Build
      run: |
        # Every file's errors in one run, not the first file's only.
        defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
        xcodebuild -project build-ios/wowee.xcodeproj -target wowee \
          -configuration Release -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          -quiet

    - name: Package the .ipa
      run: |
        # Wherever the generator put it (CMake's output directory, not
        # Xcode's Release-iphoneos).
        APP="$(find build-ios -name 'Wowee.app' -type d -prune | head -1)"
        if [ -z "$APP" ] || [ ! -x "$APP/Wowee" ]; then
          echo "No Wowee.app with its executable under build-ios" >&2
          find build-ios -name '*.app' >&2
          exit 1
        fi
        echo "App bundle: $APP"
        # assets/ and Data/ are copied in by the target's post-build steps;
        # the addons go beside them, where the addon search looks.
        if [ ! -d "$APP/assets" ] || [ ! -d "$APP/Data" ]; then
          echo "assets/ or Data/ missing from $APP" >&2
          ls "$APP" >&2
          exit 1
        fi
        cp -R addons "$APP/"
        rm -rf "$APP/assets/Original Music"
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -qry wowee-ios-arm64-unsigned.ipa Payload

    - name: Upload .ipa
      uses: actions/upload-artifact@v5
      with:
        name: wowee-ios-arm64-ipa
        path: wowee-ios-arm64-unsigned.ipa
        if-no-files-found: error

  # Every push to master publishes what the builds above made as a GitHub
  # release of its own, tagged with the run and the commit, and marked as the
  # latest - so the newest build is always the one the release page offers.
  # Pull requests and manual runs build only.
  release:
    name: Publish release
    # always(): a macOS or iOS job GitHub never found a runner for ends as
    # cancelled, and that alone must not hold back the release. A job that
    # actually failed still does, and the others have to have succeeded.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.build.result == 'success' && needs.build-windows-arm.result == 'success' &&
      needs.build-windows.result == 'success' && needs.build-android.result == 'success' &&
      needs.build-macos.result != 'failure' && needs.build-ios.result != 'failure'
    needs: [ build, build-macos, build-windows-arm, build-windows, build-android, build-ios ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts/

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        SHORT="${GITHUB_SHA::8}"
        TAG="build-${GITHUB_RUN_NUMBER}-${SHORT}"
        SUBJECT="$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}" --jq '.commit.message' | head -n1)"

        # Builds for different targets can name their packages alike (both
        # Linux debs are wowee-<ver>-Linux.deb), and a release holds one asset
        # per name, so each file goes up under its artifact's name as well.
        mkdir -p dist
        while IFS= read -r f; do
          art="$(basename "$(dirname "$f")")"
          cp "$f" "dist/${art}-$(basename "$f")"
        done < <(find artifacts -type f)
        mapfile -t FILES < <(find dist -type f | sort)
        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "No artifacts to publish" >&2
          exit 1
        fi
        printf 'Publishing %s\n' "${FILES[@]}"

        if gh release view "${TAG}" >/dev/null 2>&1; then
          gh release upload "${TAG}" --clobber "${FILES[@]}"
          gh release edit "${TAG}" --latest
        else
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Wowee build ${GITHUB_RUN_NUMBER} (${SHORT})" \
            --notes "Built from ${GITHUB_SHA}: ${SUBJECT}" \
            --latest \
            "${FILES[@]}"
        fi
