name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A newer push to the same branch, or to the same pull request, supersedes
# this run. Without it every commit queued its own full run, and a busy day
# left the release build waiting hours behind builds nobody would look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86-64
          runner: ubuntu-24.04
          deb_arch: amd64
          build_jobs: $(nproc)
        - arch: arm64
          runner: ubuntu-24.04-arm
          deb_arch: arm64
          build_jobs: 2

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ matrix.arch }}-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: apt-${{ matrix.arch }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          pkg-config \
          libglm-dev \
          libssl-dev \
          zlib1g-dev \
          libvulkan-dev \
          vulkan-tools \
          glslc \
          libavformat-dev \
          libavcodec-dev \
          libswscale-dev \
          libavutil-dev \
          libunicorn-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libxfixes-dev \
          libxss-dev \
          libxkbcommon-dev \
          libwayland-dev \
          wayland-protocols \
          libdecor-0-dev \
          libx11-dev
        sudo apt-get install -y libstorm-dev || true

    - name: Build SDL3 from source
      run: |
        # Ubuntu 24.04 has no libsdl3-dev: SDL3 landed in 25.04. Built here
        # the way StormLib already is, rather than pinning the job to a newer
        # runner image for one package.
        set -euo pipefail
        git clone --depth 1 --branch release-3.2.24 \
          https://github.com/libsdl-org/SDL.git /tmp/SDL3
        cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build /tmp/SDL3/build --parallel "$(nproc)"
        sudo cmake --install /tmp/SDL3/build
        sudo ldconfig

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_TESTS=ON

    - name: Assert AMD FSR2 target
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel ${{ matrix.build_jobs }}
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      run: |
        set -euo pipefail
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel ${{ matrix.build_jobs }}
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      run: cmake --build build --parallel ${{ matrix.build_jobs }}

    # The editor is off the default build - it is large and ordinary client
    # work does not need it - so nothing was compiling it, here or locally, and
    # it rotted: twenty files lost an include and a helper lost a method that
    # twelve callers still used, and it sat broken with no signal at all.
    # Built on this job only; one platform is enough to catch a missing include
    # or a changed signature, and the other jobs stay as quick as they were.
    - name: Build editor
      run: cmake --build build --target wowee_editor --parallel ${{ matrix.build_jobs }}

    - name: Run tests
      run: cd build && ctest --output-on-failure

    - name: Package (DEB)
      run: cd build && cpack -G DEB

    - name: Upload DEB
      uses: actions/upload-artifact@v5
      with:
        name: wowee-linux-${{ matrix.arch }}-deb
        path: build/wowee-*.deb
        if-no-files-found: error

  build-windows-arm:
    name: Build (windows-arm64)
    runs-on: windows-11-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        # Disable the install cache: a restored cache carries a stale pacman DB
        # whose signatures the older cached keyring rejects ("unknown trust"),
        # breaking the setup -Syuu after MSYS2 rotates signing keys.
        cache: false

    # Install packages in a separate retried step rather than the action's `install:`
    # list - the ARM MSYS2 mirrors intermittently drop the initial download/keyring
    # sync, which fails the whole setup with no retry. Mirrors the release workflow.
    - name: Install dependencies with mirror retry
      shell: msys2 {0}
      run: |
        packages=(
          mingw-w64-clang-aarch64-cmake
          mingw-w64-clang-aarch64-clang
          mingw-w64-clang-aarch64-ninja
          mingw-w64-clang-aarch64-pkgconf
          mingw-w64-clang-aarch64-sdl3
          mingw-w64-clang-aarch64-glm
          mingw-w64-clang-aarch64-openssl
          mingw-w64-clang-aarch64-zlib
          mingw-w64-clang-aarch64-ffmpeg
          mingw-w64-clang-aarch64-unicorn
          mingw-w64-clang-aarch64-vulkan-loader
          mingw-w64-clang-aarch64-vulkan-headers
          mingw-w64-clang-aarch64-shaderc
          mingw-w64-clang-aarch64-libtommath
          mingw-w64-clang-aarch64-libtomcrypt
          git
        )
        for attempt in 1 2 3; do
          if pacman -S --noconfirm --needed "${packages[@]}"; then
            exit 0
          fi
          echo "MSYS2 package download failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        exit 1

    - name: Build StormLib from source
      shell: msys2 {0}
      run: |
        git clone --depth 1 https://github.com/ladislav-zezula/StormLib.git /tmp/StormLib
        # Disable x86 inline asm in bundled libtomcrypt (bswapl/movl) -
        # __MINGW32__ is defined on CLANGARM64 which incorrectly enables x86 asm
        cmake -S /tmp/StormLib -B /tmp/StormLib/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_C_FLAGS="-DLTC_NO_BSWAP" \
          -DCMAKE_CXX_FLAGS="-DLTC_NO_BSWAP"
        cmake --build /tmp/StormLib/build --parallel $(nproc)
        cmake --install /tmp/StormLib/build

    - name: Configure
      shell: msys2 {0}
      # The editor ships in the Windows package as well: in the default build,
      # so the package's install rule picks it up.
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_EDITOR=ON

    - name: Assert AMD FSR2 target
      shell: msys2 {0}
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel $(nproc)
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      shell: msys2 {0}
      run: |
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel $(nproc)
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --parallel $(nproc)

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        # Every program that ships, not the client alone. The asset tools are
        # how anybody gets data to run the client with, and a configure that
        # quietly disabled them - StormLib or SDL2 not found - produced a
        # package with neither and said nothing. Their DLLs were assumed to be
        # a subset of the client's rather than collected.
        test -x build/bin/wowee.exe
        test -x build/bin/asset_extract.exe
        test -x build/bin/wowee_assets.exe
        test -x build/bin/wowee_editor.exe
        for exe in build/bin/wowee.exe build/bin/asset_extract.exe build/bin/wowee_assets.exe \
                   build/bin/wowee_editor.exe; do
          ldd "$exe" \
            | awk '/=> \// { print $3 }' \
            | grep -iv '^/c/Windows' \
            | xargs -I{} sh -c 'cp -n "{}" build/bin/ 2>/dev/null || true'
        done

    - name: Package (ZIP)
      shell: msys2 {0}
      run: cd build && cpack -G ZIP

    - name: Upload ZIP
      uses: actions/upload-artifact@v5
      with:
        name: wowee-windows-arm64-zip
        path: build/wowee-*.zip
        if-no-files-found: error

  build-windows:
    name: Build (windows-x86-64)
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        # See note above: avoid the stale cached keyring/DB "unknown trust" failure.
        cache: false

    # Installed in a retried step rather than through the action's `install:`
    # list, for the same reason the arm64 job does it: a mirror that stalls
    # mid-download fails the whole transaction, and the action has no retry -
    # so one slow mirror reads as a broken build. Seen on p11-kit, pixman and
    # openblas from mirror.msys2.org and ftp2.osuosl.org, at "less than 1
    # bytes/sec", before a single file of this project was compiled.
    - name: Install dependencies with mirror retry
      shell: msys2 {0}
      run: |
        packages=(
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-sdl3
          mingw-w64-ucrt-x86_64-glm
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-ffmpeg
          mingw-w64-ucrt-x86_64-unicorn
          mingw-w64-ucrt-x86_64-vulkan-loader
          mingw-w64-ucrt-x86_64-vulkan-headers
          mingw-w64-ucrt-x86_64-shaderc
          mingw-w64-ucrt-x86_64-nsis
          mingw-w64-ucrt-x86_64-libtommath
          mingw-w64-ucrt-x86_64-libtomcrypt
          git
        )
        for attempt in 1 2 3; do
          if pacman -S --noconfirm --needed "${packages[@]}"; then
            exit 0
          fi
          echo "MSYS2 package download failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        exit 1

    - name: Build StormLib from source
      shell: msys2 {0}
      run: |
        git clone --depth 1 https://github.com/ladislav-zezula/StormLib.git /tmp/StormLib
        cmake -S /tmp/StormLib -B /tmp/StormLib/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
          -DBUILD_SHARED_LIBS=OFF
        cmake --build /tmp/StormLib/build --parallel $(nproc)
        cmake --install /tmp/StormLib/build

    - name: Configure
      shell: msys2 {0}
      # The editor ships in the Windows package as well: in the default build,
      # so the package's install rule picks it up.
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOWEE_BUILD_EDITOR=ON

    - name: Assert AMD FSR2 target
      shell: msys2 {0}
      run: |
        set -euo pipefail
        # Built only when the backend is enabled. It is off by default now,
        # so the target does not exist unless someone asks for it.
        if cmake --build build --target help | grep -q 'wowee_fsr2_amd_vk'; then
          cmake --build build --target wowee_fsr2_amd_vk --parallel $(nproc)
        else
          echo "AMD FSR2 backend disabled; nothing to assert."
        fi

    - name: Assert AMD FSR3 framegen probe target (if present)
      shell: msys2 {0}
      run: |
        if cmake --build build --target help | grep -q 'wowee_fsr3_framegen_amd_vk_probe'; then
          cmake --build build --target wowee_fsr3_framegen_amd_vk_probe --parallel $(nproc)
        else
          echo "FSR3 framegen probe target not generated for this SDK layout; continuing."
        fi

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --parallel $(nproc)

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        # Every program that ships, not the client alone. The asset tools are
        # how anybody gets data to run the client with, and a configure that
        # quietly disabled them - StormLib or SDL2 not found - produced a
        # package with neither and said nothing. Their DLLs were assumed to be
        # a subset of the client's rather than collected.
        test -x build/bin/wowee.exe
        test -x build/bin/asset_extract.exe
        test -x build/bin/wowee_assets.exe
        test -x build/bin/wowee_editor.exe
        for exe in build/bin/wowee.exe build/bin/asset_extract.exe build/bin/wowee_assets.exe \
                   build/bin/wowee_editor.exe; do
          ldd "$exe" \
            | awk '/=> \// { print $3 }' \
            | grep -iv '^/c/Windows' \
            | xargs -I{} sh -c 'cp -n "{}" build/bin/ 2>/dev/null || true'
        done

    - name: Package (NSIS)
      shell: msys2 {0}
      run: cd build && cpack -G NSIS

    - name: Upload installer
      uses: actions/upload-artifact@v5
      with:
        name: wowee-windows-x86-64-installer
        path: build/wowee-*.exe
        if-no-files-found: error

  build-android:
    name: Build (android arm64)
    runs-on: ubuntu-24.04

    # The Android sources are behind __ANDROID__ and nothing else compiles
    # them, so until now only a release tag found out whether they still
    # built. The SDL3 migration left two renamed event constants behind in
    # application.cpp and the first sign of it was a broken release. Compiled
    # here for the same reason the editor is: one job that says so beforehand.
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        # The APK takes its version from the nearest tag, which a shallow
        # clone does not fetch. Without them the build falls back to 0.0.0.
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install the NDK the project pins
      run: |
        # android/app/build.gradle names this version; the runner ships another.
        yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
          --install "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0" >/dev/null

    - name: Cache OpenSSL for Android
      id: cache-openssl
      uses: actions/cache@v4
      with:
        path: build-android-deps
        key: android-openssl-${{ hashFiles('tools/build-android-deps.sh') }}

    - name: Build OpenSSL for arm64
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        tools/build-android-deps.sh arm64-v8a

    - name: Build the APK
      working-directory: android
      env:
        # A repository with these secrets signs every build with one key, so
        # each APK installs over the last; without them it is the debug key.
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        WOWEE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        WOWEE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          export WOWEE_KEYSTORE_FILE="${RUNNER_TEMP}/wowee.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${WOWEE_KEYSTORE_FILE}"
        fi
        ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: wowee-android-arm64-apk
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
